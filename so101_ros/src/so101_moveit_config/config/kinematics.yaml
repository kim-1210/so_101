arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  # SO-101 has five arm joints, so it cannot independently satisfy all six
  # Cartesian pose components (x/y/z + roll/pitch/yaw).  Solve only the TCP
  # position; Wrist_Roll can be commanded separately when grasp orientation
  # matters.
  position_only_ik: true
  kinematics_solver_timeout: 0.05
