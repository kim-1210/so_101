[project]
name = "so-101"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "feetech-servo-sdk>=1.0.0",
    "google-genai>=2.23.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "openai>=3.14.1",
    "openai-whisper>=20250625",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pyrealsense2>=2.58.2.10647",
    "pyserial>=3.5",
    "reportlab>=5.0.1",
    "requests>=2.34.2",
    "scipy>=1.15.3",
    "sounddevice>=0.5.6",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "transformers>=5.12.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
